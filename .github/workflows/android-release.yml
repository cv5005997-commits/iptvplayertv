name: Android APK Release

on:
  push:
    branches: [main]
    paths:
      - 'IPTVPlayerTV (1).zip'
      - 'README.md'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "IPTVPlayerTV (1).zip" -d extracted
          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::El ZIP no contiene gradlew ni settings.gradle(.kts)."
              find extracted -maxdepth 5 -type f | head -100
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply build compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p .
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          MAIN="$(find app/src/main/java -name MainActivity.kt -print -quit)"
          if [ -n "$MAIN" ]; then
            sed -i 's/import is\.xyz\.mpv\.MPVLib/import `is`.xyz.mpv.MPVLib/' "$MAIN"
          fi
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó sin generar un APK release."
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/IPTVPlayerTV.apk
          ls -lh release/IPTVPlayerTV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iptvplayertv-v1.0.${{ github.run_number }}
          name: IPTVPlayerTV v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release/IPTVPlayerTV.apk
