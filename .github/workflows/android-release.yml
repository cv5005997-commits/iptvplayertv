name: Build IPTVPlayerTV APK

on:
  push:
    branches: [main]
    paths:
      - 'IPTVPlayerTV*.zip'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'IPTVPlayerTV*.zip' -print -quit)"
          test -n "$ZIP" || { echo "::error::No se encontró IPTVPlayerTV*.zip"; exit 1; }
          unzip -q "$ZIP" -d extracted
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::El ZIP no contiene settings.gradle(.kts)"; find extracted -maxdepth 4 -type f; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if [ -f "$PROJECT_DIR/gradlew" ]; then echo "USE_WRAPPER=true" >> "$GITHUB_ENV"; else echo "USE_WRAPPER=false" >> "$GITHUB_ENV"; fi
          echo "Proyecto: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path("app").glob("build.gradle*"):
              s = p.read_text()
              s2 = re.sub(r'(\bminSdk\s*=\s*)21\b', r'\g<1>26', s)
              s2 = re.sub(r'(\bminSdkVersion\s+|\bminSdkVersion\s*=\s*)21\b', r'\g<1>26', s2)
              if s2 != s:
                  p.write_text(s2)
                  print("minSdk actualizado a 26:", p)
          candidates = list(Path("app/src/main/java").rglob("MainActivity.kt"))
          for p in candidates:
              lines = p.read_text().splitlines()
              found = [i for i, line in enumerate(lines) if line.strip().startswith("import ") and "MPVLib" in line]
              for i in found:
                  lines[i] = "import dev.jdtech.mpv.MPVLib"
              if found:
                  p.write_text("\n".join(lines) + "\n")
                  print("Import MPVLib corregido:", p)
          PY
          [ ! -f ./gradlew ] || chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::No se generó APK release"; exit 1; }
          mkdir -p release
          cp "$APK" release/IPTVPlayerTV.apk
          ls -lh release/IPTVPlayerTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iptvplayertv-v1.0.${{ github.run_number }}
          name: IPTVPlayerTV v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release/IPTVPlayerTV.apk
